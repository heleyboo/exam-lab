services:
  postgres:
    # pgvector dựng sẵn trên Postgres 17: kho câu hỏi cần tìm câu trùng bằng embedding.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: examlab
      POSTGRES_PASSWORD: examlab
      POSTGRES_DB: examlab
    ports:
      # Máy dev thường đã có Postgres khác chiếm 5432, nên ánh xạ ra cổng riêng.
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examlab -d examlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Docker Hub không còn phát hành image MinIO, phải lấy từ quay.io
    # Thay cho Cloudflare R2 khi chạy máy dev: cùng giao thức S3 nên code không đổi.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: examlab
      MINIO_ROOT_PASSWORD: examlab123
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tạo sẵn bucket rồi thoát, để lần chạy đầu không phải vào console bấm tay.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 examlab examlab123 &&
      mc mb --ignore-existing local/examlab &&
      echo 'bucket examlab sẵn sàng'
      "

volumes:
  postgres-data:
  minio-data:
